<!DOCTYPE html>
<html>
<head>
    <title>GET and POST Methods</title>
</head>
<body>

<h1>GET Method</h1>

<form method="GET">
    Name:
    <input type="text" name="name">

    <input type="submit" value="Submit GET">
</form>

<hr>

<h1>POST Method</h1>

<form method="POST" action="">
    Name:
    <input type="text" name="name">

    <input type="submit" value="Submit POST">
</form>

</body>
</html>
