<!DOCTYPE html>
<html>
<head>
    <title>Images and Hyperlinks</title>
</head>
<body>

<h1>Webpage Using Images and Hyperlinks</h1>

<h2>Image</h2>

<img src="image.jpg"
     alt="Sample Image"
     width="300"
     height="200">

<br><br>

<h2>Hyperlink</h2>

<a href="https://www.google.com" target="_blank">
    Open Google
</a>

<h2>Iframe</h2>

<iframe
    src="https://www.wikipedia.org"
    width="600"
    height="400">
</iframe>

</body>
</html>
