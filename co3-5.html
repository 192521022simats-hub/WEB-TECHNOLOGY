<!DOCTYPE html>
<html>
<head>
    <title>Cross Browser Webpage</title>

    <script>
        function checkBrowserFeatures() {

            let result = document.getElementById("result");

            if (typeof localStorage !== "undefined") {
                result.innerHTML += "✓ LocalStorage supported<br>";
            } else {
                result.innerHTML += "✗ LocalStorage not supported<br>";
            }

            if (document.querySelector) {
                result.innerHTML += "✓ querySelector supported<br>";
            } else {
                result.innerHTML += "✗ querySelector not supported<br>";
            }

            if (window.addEventListener) {
                result.innerHTML += "✓ addEventListener supported<br>";
            } else {
                result.innerHTML += "✗ addEventListener not supported<br>";
            }

            if (window.fetch) {
                result.innerHTML += "✓ Fetch API supported<br>";
            } else {
                result.innerHTML += "✗ Fetch API not supported<br>";
            }
        }

        function saveData() {

            if (typeof localStorage !== "undefined") {

                localStorage.setItem(
                    "studentName",
                    "Vishal"
                );

                alert("Data saved successfully");
            }
        }

        function getData() {

            if (typeof localStorage !== "undefined") {

                let name = localStorage.getItem("studentName");

                alert("Stored Name: " + name);
            }
        }
    </script>
</head>

<body>

<h2>Cross-Browser Compatible Webpage</h2>

<button onclick="checkBrowserFeatures()">
    Check Browser Features
</button>

<button onclick="saveData()">
    Save Data
</button>

<button onclick="getData()">
    Get Data
</button>

<div id="result"></div>

</body>
</html>
