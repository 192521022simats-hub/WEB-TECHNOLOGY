<!DOCTYPE html>
<html>
<head>
    <title>Student Result Analysis</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eee;
        }

        .box {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 5px;
        }

        button {
            padding: 10px 30px;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Result Analysis</h2>

    <input type="number" id="m1" placeholder="Subject 1">
    <input type="number" id="m2" placeholder="Subject 2">
    <input type="number" id="m3" placeholder="Subject 3">
    <input type="number" id="m4" placeholder="Subject 4">
    <input type="number" id="m5" placeholder="Subject 5">

    <br>

    <button onclick="calculateResult()">Calculate</button>

    <div id="result"></div>

</div>

<script>

function calculateResult() {

    let marks = [
        Number(document.getElementById("m1").value),
        Number(document.getElementById("m2").value),
        Number(document.getElementById("m3").value),
        Number(document.getElementById("m4").value),
        Number(document.getElementById("m5").value)
    ];

    let total = marks.reduce((a, b) => a + b, 0);
    let average = total / marks.length;

    let highest = Math.max(...marks);
    let lowest = Math.min(...marks);

    let grade;

    if (average >= 90)
        grade = "A+";
    else if (average >= 80)
        grade = "A";
    else if (average >= 70)
        grade = "B";
    else if (average >= 60)
        grade = "C";
    else if (average >= 50)
        grade = "D";
    else
        grade = "Fail";

    document.getElementById("result").innerHTML =
        "Total Marks: " + total + "<br>" +
        "Average: " + average.toFixed(2) + "<br>" +
        "Highest Mark: " + highest + "<br>" +
        "Lowest Mark: " + lowest + "<br>" +
        "Grade: " + grade;
}

</script>

</body>
</html>
