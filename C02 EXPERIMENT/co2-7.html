 <!DOCTYPE html>
<html>
<head>
    <title>Online Quiz</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
        }

        .quiz {
            width: 500px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            box-shadow: 0 0 10px gray;
        }

        .question {
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 30px;
        }

        #score {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h2>Online Quiz</h2>

    <div class="question">
        <p>1. What does HTML stand for?</p>

        <input type="radio" name="q1" value="correct">
        Hyper Text Markup Language<br>

        <input type="radio" name="q1" value="wrong">
        High Text Machine Language
    </div>

    <div class="question">
        <p>2. Which language is used for styling?</p>

        <input type="radio" name="q2" value="wrong">
        HTML<br>

        <input type="radio" name="q2" value="correct">
        CSS
    </div>

    <div class="question">
        <p>3. Which language adds interactivity?</p>

        <input type="radio" name="q3" value="correct">
        JavaScript<br>

        <input type="radio" name="q3" value="wrong">
        HTML
    </div>

    <button onclick="calculateScore()">Submit Quiz</button>

    <p id="score"></p>

</div>

<script>

function calculateScore() {

    let answers = document.querySelectorAll(
        'input[type="radio"]:checked'
    );

    let score = 0;

    answers.forEach(function(answer) {

        if (answer.value == "correct") {
            score++;
        }

    });

    document.getElementById("score").innerHTML =
        "Your Score: " + score + "/3";
}

</script>

</body>
</html>
