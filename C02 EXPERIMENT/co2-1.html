<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f2f2f2;
        }

        .profile {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border: 2px solid #333;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #333;
        }

        h1 {
            color: #333;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .skill {
            padding: 10px 20px;
            background: #ddd;
            border-radius: 20px;
        }

        @media (max-width: 600px) {
            .profile {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

<div class="profile">

    <img src="https://via.placeholder.com/150" alt="Student">

    <h1>Vishal S</h1>

    <h3>B.Tech Information Technology</h3>

    <p>
        I am an IT student interested in web development,
        programming and technology.
    </p>

    <h2>Skills</h2>

    <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">JavaScript</div>
        <div class="skill">Python</div>
    </div>

</div>

</body>
</html>
